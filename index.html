const cues={
'KB Swing':'Hinge at the hips, snap them forward and keep the bell close.','Goblet Squat':'Brace, sit between the hips and drive through the floor.','Single-arm KB Clean':'Hike, extend the hips and guide the bell smoothly to the rack.','Reverse Lunge':'Step back under control and drive up through the front foot.','Single-arm KB Row':'Brace the torso and pull the elbow toward the hip without twisting.','Push-up':'Keep a straight body line and press evenly.','Clean & Press':'Clean to a stable rack, brace, then press overhead.','KB Push Press':'Small dip, powerful leg drive and controlled overhead finish.','Back Squat':'Brace hard, descend with control and drive up strongly.','RDL':'Soft knees, hips back, lats tight and controlled descent.','Bulgarian Split Squat':'Stable front foot, controlled depth and strong drive.','Hamstring Curl':'Control both directions and pause briefly at the contraction.','Calf Raise':'Use a comfortable full range with a controlled stretch.','Countermovement Jump':'Quick dip, explosive takeoff and quiet landing.','Broad Jump':'Load the hips, swing the arms and project forward; stick the landing.','Lateral Bound':'Push laterally and own the single-leg landing.','Box Jump':'Jump with intent, land softly and step down.','Approach Jump':'Use a consistent approach and maximize vertical takeoff.','Skater Jump':'Explode side-to-side and stabilize each landing.','5-10-5 Shuttle':'Stay low, plant decisively and accelerate out.','Lateral Shuffle':'Stay low, push the floor away and avoid crossing the feet.','Sled Push':'Forward body angle and powerful steps; treat each rep as acceleration work.','Bench Press':'Set the shoulders, lower under control and press evenly.','Pull-up':'Start controlled and pull without swinging.','DB Incline Press':'Keep shoulders stable and press smoothly.','Chest-supported Row':'Pull elbows back and pause briefly without shrugging.','DB Lateral Raise':'Soft elbows and controlled motion; avoid momentum.','Med-ball Rotational Throw':'Load the hips and rotate explosively through the trunk.','Med-ball Scoop Toss':'Load the hips and extend rapidly into the throw.','Trap-bar Deadlift':'Brace, push the floor away and finish tall.','Front Squat':'Keep elbows high, brace and descend under control.','Push Press':'Vertical dip, aggressive leg drive and stable lockout.','Weighted Pull-up':'Strict, controlled reps with no swinging.','Bike Zone 2':'Steady conversational effort around RPE 5–6.','Bike Intervals':'Hard efforts around RPE 8–9 with easy recovery.','Wall Acceleration Drill':'Lean into the wall and alternate strong knee drives.','Depth Landing':'Step down, absorb quietly and stabilize.'};
cues['Biceps Curl']='Keep elbows near your sides and lower under control.';
cues['Hammer Curl']='Keep wrists neutral and avoid swinging the torso.';
cues['Triceps Extension']='Keep upper arms steady and move through a comfortable range.';
cues['Face Pull']='Pull toward eye level with elbows high; squeeze shoulder blades gently.';
cues['Hip Thrust']='Keep ribs down, drive through feet and finish with glutes, not the lower back.';
cues['Pallof Press']='Brace and resist rotation while pressing straight out.';
cues['Dead Bug']='Keep lower back gently braced as opposite arm and leg extend.';
cues['Side Plank']='Keep hips stacked and body in a straight line.';
cues['Glute Bridge']='Drive through heels and squeeze glutes at the top.';
cues['Farmer Carry']='Walk tall, keep ribs stacked and avoid leaning.';
cues['Single-leg Broad Jump']='Use a controlled takeoff and stick the landing; stop if balance or landing quality drops.';
cues['Pogo Jumps']='Use small, quick ankle hops with a stiff, springy landing.';
cues['Tuck Jump']='Dip quickly, jump vertically, bring knees up without collapsing the landing.';
cues['Snap Down']='Reach tall, then snap into an athletic position and absorb quietly.';
cues['A-Skip']='Drive the knee rhythmically while keeping the foot active under the body.';
cues['World’s Greatest Stretch']='Move slowly through the lunge, rotation and hamstring positions.';
cues['Walking Lunge']='Long controlled steps, upright torso and stable front knee.';
cues['Inchworm']='Walk hands out to a plank, then return under control.';
cues['Lateral Lunge']='Sit into the working hip while keeping the opposite leg long.';
cues['Wall Acceleration Drill']='Lean into the wall, keep a straight line and drive alternating knees.';
const days={
1:{title:'Kettlebell power · Chest & triceps',ex:[['KB Swing',4,'8',6,'power'],['Single-arm KB Clean',3,'5/side',6,'power'],['KB Push Press',3,'6/side',7,'upper'],['Bench Press',4,'6–8',7,'upper'],['DB Incline Press',3,'8–10',7,'upper'],['Cable Fly',2,'12–15',7,'upper'],['Triceps Extension',3,'10–12',7,'upper'],['Bike Intervals',8,'30 sec brisk / 60 sec easy',6,'cardio']]},
2:{title:'Plyometrics · Quads & calves',ex:[['Snap Down',2,'5',5,'power'],['Countermovement Jump',3,'3',6,'power'],['Lateral Bound',3,'3/side',6,'power'],['Sled Push',5,'10–15 m',6,'power'],['Pogo Jumps',2,'8',5,'power'],['Back Squat',4,'5–6',7,'lower'],['Bulgarian Split Squat',3,'8/side',7,'lower'],['Leg Extension',2,'10–12',7,'lower'],['Calf Raise',3,'12–15',7,'lower'],['Bike Intervals',8,'30 sec hard / 75 sec easy',7,'cardio']]},
3:{title:'Kettlebell athletic work · Back & biceps',ex:[['KB Halo',2,'8/direction',5,'power'],['Single-arm KB Row',3,'8/side',6,'upper'],['KB Swing',3,'10',6,'power'],['Pull-up',4,'6–8',7,'upper'],['Chest-supported Row',3,'8–10',7,'upper'],['Lat Pulldown',2,'10–12',7,'upper'],['Hammer Curl',3,'10–12',7,'upper'],['Face Pull',2,'12–15',6,'upper'],['Row Intervals',10,'30 sec brisk / 60 sec easy',7,'cardio']]},
4:{title:'Plyometrics · Hamstrings & glutes',ex:[['Broad Jump',3,'3',6,'power'],['Skater Jump',3,'3/side',6,'power'],['Approach Jump',3,'2',6,'power'],['RDL',4,'6–8',7,'lower'],['Hip Thrust',3,'8–10',7,'lower'],['Seated Leg Curl',3,'10–12',7,'lower'],['Lateral Lunge',2,'8/side',6,'lower'],['Bike Zone 2',1,'12–15 min',6,'cardio']]},
5:{title:'Kettlebell & rotational power · Shoulders, arms & core',ex:[['Clean & Press',3,'5/side',6,'power'],['Med-ball Rotational Throw',3,'4/side',6,'power'],['Farmer Carry',3,'30 m',6,'core'],['DB Shoulder Press',3,'8–10',7,'upper'],['DB Lateral Raise',3,'12–15',7,'upper'],['Rear-delt Fly',2,'12–15',7,'upper'],['Biceps Curl',3,'10–12',7,'upper'],['Pallof Press',3,'10/side',6,'core'],['Bike Intervals',10,'20 sec hard / 60 sec easy',7,'cardio']]}
};
const firstWeights={
'Back Squat':'95 lb','RDL':'95 lb','Bulgarian Split Squat':'20 lb/hand','Hamstring Curl':'50 lb','Calf Raise':'70 lb',
'Bench Press':'85 lb','Cable Fly':'15–20 lb/side','Leg Extension':'40–50 lb','Lat Pulldown':'70–85 lb','Seated Leg Curl':'40–50 lb','DB Shoulder Press':'20–25 lb/hand','Rear-delt Fly':'10–15 lb/hand','Lateral Lunge':'Bodyweight to start','DB Incline Press':'25 lb/hand','Chest-supported Row':'35 lb/hand','DB Lateral Raise':'10 lb/hand','Pull-up':'Bodyweight','Weighted Pull-up':'Bodyweight only',
'Trap-bar Deadlift':'135 lb','Front Squat':'75 lb','Push Press':'50 lb','Sled Push':'Moderate sled load — start light enough to keep every rep fast',
'KB Swing':'35 lb / 16 kg','Goblet Squat':'35 lb / 16 kg','Single-arm KB Clean':'20 lb / 9 kg','KB Halo':'10–15 lb','Seated Single-arm KB Press':'15–20 lb','Clean & Press':'20 lb / 9 kg','KB Push Press':'20 lb / 9 kg','Single-arm KB Row':'35 lb / 16 kg',
'Med-ball Rotational Throw':'6–8 lb','Med-ball Scoop Toss':'6–8 lb','Med-ball Chest Pass':'6–8 lb','Plyometric Push-up':'Bodyweight; use an incline if needed','Biceps Curl':'15 lb/hand','Hammer Curl':'15 lb/hand','Triceps Extension':'20 lb','Face Pull':'25 lb','Hip Thrust':'95 lb','Pallof Press':'15 lb','Dead Bug':'Bodyweight','Side Plank':'Bodyweight','Glute Bridge':'Bodyweight','Farmer Carry':'35 lb/hand','Single-leg Broad Jump':'Bodyweight','Push-up':'Bodyweight','Box Jump':'Bodyweight','Countermovement Jump':'Bodyweight','Broad Jump':'Bodyweight','Lateral Bound':'Bodyweight','Skater Jump':'Bodyweight','Approach Jump':'Bodyweight','Pogo Jumps':'Bodyweight','Tuck Jump':'Bodyweight','Sled Push':'Light-to-moderate load'
};
function recWeight(name){return firstWeights[name]||''}
const substitutions={'Sled Push':['Bike Intervals','Wall Acceleration Drill'],'5-10-5 Shuttle':['Lateral Shuffle','Skater Jump'],'Box Jump':['Countermovement Jump','Broad Jump'],'Approach Jump':['Countermovement Jump','Broad Jump'],'Weighted Pull-up':['Pull-up'],'Med-ball Rotational Throw':['Med-ball Scoop Toss'],'Med-ball Scoop Toss':['Med-ball Rotational Throw'],'Bike Zone 2':['Row Zone 2'],'Bike Intervals':['Row Intervals']};
let S=JSON.parse(localStorage.getItem('athleticV8')||'null')||{logs:{},notes:{},subs:{},history:[],skipped:[]};
S.logs=S.logs||{};S.notes=S.notes||{};S.subs=S.subs||{};S.history=Array.isArray(S.history)?S.history:[];S.skipped=Array.isArray(S.skipped)?S.skipped:[];
S.skipped=S.skipped||[];
let page='today',viewW=null,viewD=null;
function save(){localStorage.setItem('athleticV8',JSON.stringify(S))}
function key(w,d,i,s){return `${w}-${d}-${i}-${s}`}
function phase(w){return w<=3?'Build':w===4?'Recovery week':w<=7?'Intensification':'Consolidation / reduced volume'}
function adjust(ex,w,d){let a=JSON.parse(JSON.stringify(ex));if([4,8].includes(w))a=a.map(x=>({...x,1:Math.max(1,Math.ceil(x[1]*.65)),3:6}));if(w>=5&&w<=7){if(d===2){setx(a,'Sled Push',7);setx(a,'Back Squat',5,'4');setx(a,'RDL',3,'6')}if(d===4){setx(a,'Bench Press',5,'5');setx(a,'Approach Jump',5)}if(d===5){setx(a,'Trap-bar Deadlift',5,'4');setx(a,'Front Squat',3,'5');setx(a,'Push Press',5,'4')}}if(w===8){a=a.map(x=>({...x,1:Math.max(1,Math.ceil(x[1]*.6))}));}return a}
function setx(a,n,sets,reps){let x=a.find(e=>e[0]===n);if(x){x[1]=sets;if(reps)x[2]=reps}}
function complete(w,d){let a=adjust(days[d].ex,w,d);return a.every((e,i)=>Array.from({length:e[1]},(_,s)=>S.logs[key(w,d,i,s)]?.done).every(Boolean))}
function current(){let n=S.history.length;for(let w=1;w<=8;w++){for(let d=1;d<=5;d++){let k=`${w}-${d}`;if(S.history.includes(k)||S.skipped.includes(k))continue;return {w,d,n,complete:false}}}return {w:8,d:5,n,complete:true}}
function workoutProgress(w,d){let a=adjust(days[d].ex,w,d),total=0,done=0;a.forEach((e,i)=>{total+=e[1];for(let s=0;s<e[1];s++)if(S.logs[key(w,d,i,s)]?.done)done++});return {done,total,pct:total?Math.round(done/total*100):0}}
function go(p){page=p;viewW=null;viewD=null;render();window.scrollTo(0,0)}
function viewWorkout(w,d){viewW=w;viewD=d;page='today';render();window.scrollTo(0,0)}
function nav(){document.getElementById('nav').innerHTML=[['today','Today'],['program','8 Weeks'],['history','History'],['guide','Exercises']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function gifUrl(name){let q=encodeURIComponent(name+' exercise GIF');return `https://www.google.com/search?tbm=isch&q=${q}`}
function muscleWikiUrl(name){return `https://musclewiki.com/exercises`}
function demoLinks(name){return `<div class="demoLinks"><a class="btn" target="_blank" rel="noopener" href="${gifUrl(name)}">GIF search</a><a class="btn" target="_blank" rel="noopener" href="${muscleWikiUrl(name)}">MuscleWiki demo library</a></div>`}
function suggestion(kind,w,d,i,name){let vals=[];for(let s=0;s<30;s++){let l=S.logs[key(w,d,i,s)];if(l?.done&&l.load)vals.push(parseFloat(l.load))}if(vals.length){let last=vals[vals.length-1],max=Math.max(...vals);if(kind==='cardio'||kind==='power')return `<div class="suggest">Previous: <b>${last}</b>. Keep it similar and prioritize speed/quality.</div>`;let inc=kind==='upper'?5:10;return `<div class="suggest">Suggested next load: <b>${max+inc}</b>. Keep the increase only if all reps were controlled and pain-free.</div>`}let base=recWeight(name);return base?`<div class="suggest">Recommended: <b>${base}</b></div>`:''}
function toggleSet(k,checked){S.logs[k]=S.logs[k]||{};S.logs[k].done=checked;save();render();if(checked)toast('Set complete ✓')}
function updSet(w,d,i,s,f,v){let k=key(w,d,i,s);S.logs[k]=S.logs[k]||{};S.logs[k][f]=v;delete S.logs[k]['manual_'+f];save();for(let j=s+1;j<30;j++){let nk=key(w,d,i,j),next=S.logs[nk];if(!next)next=S.logs[nk]={};if(next['manual_'+f])break;next[f]=v;let el=document.querySelector(`[data-w="${w}"][data-d="${d}"][data-i="${i}"][data-s="${j}"][data-field="${f}"]`);if(el)el.value=v;}save()}
function upd(k,f,v){S.logs[k]=S.logs[k]||{};S.logs[k][f]=v;save()}
function manualSet(w,d,i,s,f,v){let k=key(w,d,i,s);S.logs[k]=S.logs[k]||{};S.logs[k][f]=v;S.logs[k]['manual_'+f]=true;save()}
function finishWorkout(){let c=current();if(c.complete){toast('8-week program complete!');return}let p=workoutProgress(c.w,c.d);if(p.done<p.total){toast('Complete all prescribed sets first');return}let k=`${c.w}-${c.d}`;if(!S.history.includes(k))S.history.push(k);S.skipped=S.skipped.filter(x=>x!==k);save();let next=current();toast(next.complete?'8-week program complete!':`Workout complete • Next: Week ${next.w}, Workout ${next.d}`);viewW=null;viewD=null;render();window.scrollTo(0,0)}
function skipWorkout(){let c=current(),k=`${c.w}-${c.d}`;if(!confirm(`Skip Week ${c.w} • Workout ${c.d}? It will be marked skipped and the next workout will become current.`))return;if(!S.skipped.includes(k)&&!S.history.includes(k))S.skipped.push(k);save();viewW=null;viewD=null;render();window.scrollTo(0,0);toast('Workout skipped; next workout unlocked')} 
function toast(t){let old=document.querySelector('.toast');if(old)old.remove();let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function substitute(w,d,i){let opts=substitutions[days[d].ex[i][0]]||[];let currentSub=S.subs[`${w}-${d}-${i}`];let box=document.getElementById('sub-'+i);if(!box)return;box.innerHTML=opts.map(o=>`<div class="subOption"><span>${o}</span><button class="btn" onclick="chooseSub(${w},${d},${i},'${o.replace(/'/g,"\\'")}')">Use</button></div>`).join('')+(currentSub?`<button class="btn" onclick="clearSub(${w},${d},${i})">Restore original</button>`:'');box.style.display=box.style.display==='none'?'block':'none'}
function chooseSub(w,d,i,o){S.subs[`${w}-${d}-${i}`]=o;save();render();toast('Substitution selected')}
function clearSub(w,d,i){delete S.subs[`${w}-${d}-${i}`];save();render()}
function exerciseCard(e,i,w,d,readonly){let [n,sets,reps,rpe,kind]=e,sub=S.subs[`${w}-${d}-${i}`],display=sub||n,sugg=readonly?'':suggestion(kind,w,d,i,display),demo=demoLinks(display);return `<section class="exercise"><div class="exerciseHead"><div style="flex:1"><div class="name">${display}</div><div class="target">${sets} sets × ${reps}</div><div class="cue">${cues[display]||cues[n]||''}</div></div></div>${demo}${sub?`<div class="subbox"><b>Substituted for ${n}</b></div>`:''}${sugg}<div class="sets">${Array.from({length:sets},(_,s)=>{let k=key(w,d,i,s),l=S.logs[k]||{};let prev=s>0?(S.logs[key(w,d,i,s-1)]||{}):{};let loadVal=l.load!==undefined?l.load:(prev.load||'');let repsVal=l.reps!==undefined?l.reps:(prev.reps||'');return `<div class="setrow ${l.done?'doneRow':''}"><div class="setnum">${s+1}</div><input data-w="${w}" data-d="${d}" data-i="${i}" data-s="${s}" data-field="load" aria-label="Load or time" ${readonly?'disabled':''} value="${escapeHtml(loadVal)}" placeholder="${recWeight(display)||'Load/time'}" oninput="updSet(${w},${d},${i},${s},'load',this.value)" onchange="manualSet(${w},${d},${i},${s},'load',this.value)"><input data-w="${w}" data-d="${d}" data-i="${i}" data-s="${s}" data-field="reps" aria-label="Reps or result" ${readonly?'disabled':''} value="${escapeHtml(repsVal)}" placeholder="${reps}" oninput="updSet(${w},${d},${i},${s},'reps',this.value)" onchange="manualSet(${w},${d},${i},${s},'reps',this.value)"><button class="check ${l.done?'done':''}" ${readonly?'disabled':''} onclick="toggleSet('${k}',${!l.done})">${l.done?'✓':'○'}</button></div>`}).join('')}</div>${!readonly?`<div class="exerciseTools">${substitutions[n]?`<button class="btn" onclick="substitute(${w},${d},${i})">${sub?'Change':'Substitute'}</button>`:''}</div><div id="sub-${i}" class="subbox" style="display:none"></div>`:''}</section>`}


function dayNav(w,d){let prev=d>1?[w,d-1]:w>1?[w-1,5]:null,next=d<5?[w,d+1]:w<8?[w+1,1]:null;return `<div class="dayNav"><button class="btn" ${prev?'':'disabled'} onclick="viewWorkout(${prev?prev[0]:w},${prev?prev[1]:d})">← Previous</button><div><b>W${w} • D${d}</b><div class="muted">Browse without changing your current workout</div></div><button class="btn" ${next?'':'disabled'} onclick="viewWorkout(${next?next[0]:w},${next?next[1]:d})">Next →</button></div>`}
function today(){let c=current(),w=viewW||c.w,d=viewD||c.d,readonly=!(w===c.w&&d===c.d),a=adjust(days[d].ex,w,d),p=workoutProgress(w,d),completeNow=p.done===p.total;let future=readonly&&((w>c.w)||(w===c.w&&d>c.d));document.getElementById('app').innerHTML=`${dayNav(w,d)}${future?`<div class="card notice"><b>Upcoming workout</b><div class="muted">You're viewing this for planning only. Your current workout remains Week ${c.w} • Workout ${c.d} until you complete it.</div></div>`:''}<div class="card hero"><div class="sessionTop"><div><div class="eyebrow">${readonly?'BROWSE':'CURRENT WORKOUT'}</div><h2>Week ${w} • Workout ${d}</h2><div class="muted">${phase(w)} • ${days[d].title}</div></div><span class="pill ${c.n?'green':''}">${c.n}/40</span></div><div class="bar"><i style="width:${c.n/40*100}%"></i></div>${readonly?'':`<div class="grid"><div><b style="font-size:20px">${p.done}/${p.total}</b><div class="muted">Sets complete</div></div><div><b style="font-size:20px">${p.pct}%</b><div class="muted">Workout progress</div></div></div>`}</div><div class="card"><h3>${readonly?'Workout preview':'Workout'}</h3><div class="muted">${readonly?'This is a preview. You can browse future workouts without unlocking or changing your current position.':'Complete each prescribed set. Your next workout unlocks only after every prescribed set is checked off.'}</div>${a.map((e,i)=>exerciseCard(e,i,w,d,readonly)).join('')}</div>${!readonly?`<div class="card"><h3>Session notes</h3><textarea id="notes" rows="3" placeholder="Anything to remember from this workout?">${escapeHtml(S.notes[`${w}-${d}`]||'')}</textarea><button class="btn primary" style="margin-top:8px" onclick="S.notes['${w}-${d}']=document.getElementById('notes').value;save();toast('Notes saved')">Save notes</button></div>${completeNow?`<div class="card"><h3>Workout complete ✓</h3><div class="muted">Your next workout is now unlocked.</div></div>`:''}<button class="btn skipBtn" onclick="skipWorkout()">Skip this workout →</button>`:''}`;document.getElementById('sticky').innerHTML=!readonly?`<div class="stickyActions"><div class="stickyInner"><button class="btn primary big" ${completeNow?'':'disabled'} onclick="finishWorkout()">${completeNow?'Complete workout ✓':'Complete all sets to finish'}</button></div></div>`:'';}
function program(){let c=current();let rows='';for(let w=1;w<=8;w++)for(let d=1;d<=5;d++){let done=complete(w,d),cur=w===c.w&&d===c.d,skipped=S.skipped.includes(`${w}-${d}`);rows+=`<tr class="${cur?'currentRow':''}"><td>W${w}</td><td>${d}</td><td>${days[d].title}</td><td>${done?'<span class="pill green">Complete</span>':skipped?'<span class="pill">Skipped</span>':cur?'<span class="pill">Current</span>':'<button class="btn" onclick="viewWorkout('+w+','+d+')">Preview</button>'}</td></tr>`}document.getElementById('app').innerHTML=`<div class="card"><h2>8-Week Program</h2><p class="muted">Sequence-based, not calendar-based. Rest days do not advance the program. Use Preview to look ahead without unlocking anything.</p><div class="bar"><i style="width:${c.n/40*100}%"></i></div><div class="muted">${c.n} of 40 workouts completed</div></div><div class="card"><div class="tableWrap"><table><tr><th>Week</th><th>Workout</th><th>Focus</th><th>Status</th></tr>${rows}</table></div></div>`;document.getElementById('sticky').innerHTML=''}
function history(){let done=S.history.slice().reverse();let skipped=S.skipped.slice().reverse();document.getElementById('app').innerHTML=`<div class="card"><div class="grid"><div class="stat"><b>${done.length}</b><span>Completed</span></div><div class="stat"><b>${40-done.length}</b><span>Remaining</span></div><div class="stat"><b>W${current().w} D${current().d}</b><span>Current</span></div></div></div><div class="card"><h2>Workout history</h2>${done.length?done.map(k=>{let [w,d]=k.split('-').map(Number);return `<div class="historyItem"><div class="row between"><div><b>Week ${w} • Workout ${d}</b><div class="muted">${days[d].title}</div>${S.notes[k]?`<div class="muted" style="margin-top:5px">${escapeHtml(S.notes[k])}</div>`:''}</div><span class="pill green">✓</span></div></div>`}).join(''):'<div class="muted">No completed workouts yet.</div>'}${skipped.length?`<h3 style="margin-top:16px">Skipped workouts</h3>${skipped.map(k=>{let [w,d]=k.split('-').map(Number);return `<div class="historyItem"><b>Week ${w} • Workout ${d}</b><div class="muted">${days[d].title}</div><button class="btn" onclick="restoreSkipped('${k}')">Restore to queue</button></div>`}).join('')}`:''}</div><div class="card"><h3>Data</h3><div class="tools"><button class="btn" onclick="exportData()">Export data</button><button class="btn" onclick="if(confirm('Reset all tracker data? This cannot be undone.')){localStorage.removeItem('athleticV8');location.reload()}">Reset</button></div></div>`;document.getElementById('sticky').innerHTML=''}
function restoreSkipped(k){S.skipped=S.skipped.filter(x=>x!==k);save();render();toast('Workout returned to sequence')}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='athletic-tracker-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function guide(){let arr=Object.keys(cues);document.getElementById('app').innerHTML=`<div class="card"><h2>Exercise Guide</h2><div class="muted">Each exercise links to an external GIF search and exercise demo library.</div></div><div class="card">${arr.map(n=>`<div class="guideItem"><div><b>${n}</b></div><div class="muted" style="margin:4px 0">${cues[n]}</div>${demoLinks(n)}</div>`).join('')}</div>`;document.getElementById('sticky').innerHTML=''}
function render(){nav();({today,program,history,guide}[page])()}
render();
</script></body></html>
